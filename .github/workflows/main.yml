name: Build Mobile 10X Trader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          mkdir project
          unzip -q Mobile10XTrader_ONE_UPLOAD.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Mobile10XTrader.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile10XTrader-APK
          path: Mobile10XTrader.apk
